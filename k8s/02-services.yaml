# The five backend services + shared settings + the seed job + the autoscaler.
# ${IMAGE_PREFIX} and ${IMAGE_TAG} are filled in by the deploy workflow (with envsubst).
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: custodian
data:
  STATE_STORE: "redis"
  REDIS_URL: "redis://redis:6379/0"
  DEMO_MODE: "true"
  LOG_LEVEL: "info"
  CAPTURE_DETECT_URL: "http://capture-detect:8001"
  RISK_ENGINE_URL: "http://risk-engine:8002"
  INVESTIGATOR_URL: "http://investigator:8003"
  WARN_ESCALATE_URL: "http://warn-escalate:8004"
  REVIEW_REPORT_URL: "http://review-report:8005"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capture-detect
  namespace: custodian
spec:
  replicas: 1
  selector:
    matchLabels:
      app: capture-detect
  template:
    metadata:
      labels:
        app: capture-detect
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: capture-detect
          image: ${IMAGE_PREFIX}/custodian-capture-detect:${IMAGE_TAG}
          ports:
            - containerPort: 8001
          env:
            - name: PORT
              value: "8001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
          envFrom:
            - configMapRef:
                name: app-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: capture-detect
  namespace: custodian
spec:
  selector:
    app: capture-detect
  ports:
    - port: 8001
      targetPort: 8001
---
