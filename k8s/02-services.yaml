---
# Autoscaler: adds capture-detect pods when the CPU is busy (for example when an exam starts).
# It needs "metrics-server", which the deploy workflow installs.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: capture-detect
  namespace: custodian
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: capture-detect
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# One-off job: creates the tables and the demo accounts and demo exam. Safe to run again.
apiVersion: batch/v1
kind: Job
metadata:
  name: seed
  namespace: custodian
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: seed
          image: ${IMAGE_PREFIX}/custodian-review-report:${IMAGE_TAG}
          workingDir: /app
          command: ["python", "scripts/seed.py"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_URL
          envFrom:
            - configMapRef:
                name: app-config
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
