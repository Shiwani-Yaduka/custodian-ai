# NGINX does two jobs:
#  1. serves the React app
#  2. forwards /api/... calls to the five backend services inside the cluster
# Because the browser only talks to this one address, there are no CORS problems.

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. The camera and microphone are allowed ONLY for this site.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    # The trailing slash on proxy_pass removes the /api/xxx/ prefix before forwarding.
    location /api/capture/      { proxy_pass http://capture-detect:8001/; }
    location /api/risk/         { proxy_pass http://risk-engine:8002/; }
    location /api/investigator/ { proxy_pass http://investigator:8003/; }
    location /api/warn/         { proxy_pass http://warn-escalate:8004/; }
    location /api/review/       { proxy_pass http://review-report:8005/; }

    # Grafana dashboards, available at /grafana/
    location /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
    }

    # Any other address: give the React app (it does its own page routing)
    location / {
        try_files $uri /index.html;
    }
}
