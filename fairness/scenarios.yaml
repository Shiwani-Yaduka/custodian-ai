      - { t: 45.0, signal: multiple_faces, duration: 2.5, confidence: 0.85 }

  - id: pet_cat_jumps_on_desk
    title: Pet Cat Jumps on Desk
    class: environmental_noise
    label: must_not_flag
    rationale: Cat briefly walks in front of camera for 3.0s. Below 5s grace window for face absent.
    expected_max_tier: CLEAR
    expected_hold: false
    expected_resolution: null
    timeline:
      - { t: 50.0, signal: face_absent, duration: 3.0, confidence: 0.90 }

  - id: street_traffic_ambulance_siren
    title: Ambulance Siren Outside Window
    class: environmental_noise
    label: must_not_flag
