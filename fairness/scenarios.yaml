# Custodian AI Fairness Regression Suite — 32 Benchmark Scenarios
# Grouped into 6 behavioral/environmental classes:
# 1. reading_thinking_habits (Must Not Flag)
# 2. movement_patterns (Must Not Flag)
# 3. lighting_conditions (Must Not Flag)
# 4. equipment_faults (Must Not Flag)
# 5. environmental_noise (Must Not Flag)
# 6. deliberate_violations (Must Catch)

scenarios:
  # =========================================================================
  # CLASS 1: READING & THINKING HABITS (Must Not Flag)
  # =========================================================================

  - id: calm_attentive_student
    title: Calm Attentive Student
    class: reading_thinking_habits
    label: must_not_flag
    rationale: Normal, focused student answering questions with steady attention. Must remain in CLEAR tier.
    expected_max_tier: CLEAR
    expected_hold: false
    expected_resolution: null
    timeline:
      - { t: 35.0, signal: gaze_off_screen, duration: 1.0, confidence: 0.85 }
      - { t: 90.0, signal: head_turn, duration: 1.5, confidence: 0.85 }
      - { t: 150.0, signal: gaze_off_screen, duration: 1.2, confidence: 0.90 }

  - id: brief_glance_at_clock
    title: Brief Glance at Wall Clock
    class: reading_thinking_habits
    label: must_not_flag
    rationale: Looking up at a wall clock or timer for 2.5s is well below the 4.0s grace window. Must contribute 0 risk.
    expected_max_tier: CLEAR
    expected_hold: false
    expected_resolution: null
    timeline:
      - { t: 40.0, signal: gaze_off_screen, duration: 2.5, confidence: 0.85 }
      - { t: 41.0, signal: head_turn, duration: 2.0, confidence: 0.80 }

  - id: reading_long_essay_prompt
    title: Reading Long Essay Prompt
    class: reading_thinking_habits
    label: must_not_flag
    rationale: Eyes scanning across a wide 27-inch monitor while reading a dense paragraph. Single sensor with low weight must decay away.
    expected_max_tier: CLEAR
    expected_hold: false
    expected_resolution: null
    timeline:
      - { t: 45.0, signal: gaze_off_screen, duration: 5.0, confidence: 0.70 }
      - { t: 50.0, signal: gaze_off_screen, duration: 4.5, confidence: 0.65 }

  - id: looking_up_to_think_often
    title: Looking Up to Think Often
    class: reading_thinking_habits
    label: must_not_flag
    rationale: Student gazes up toward ceiling while mentally formulating code or math. Bursts are <= 3.0s (under 4s grace).
    expected_max_tier: CLEAR
    expected_hold: false
    expected_resolution: null
    timeline:
      - { t: 40.0, signal: head_turn, duration: 3.0, confidence: 0.85 }
      - { t: 85.0, signal: head_turn, duration: 2.8, confidence: 0.85 }
      - { t: 135.0, signal: head_turn, duration: 3.0, confidence: 0.85 }

  - id: mumbling_math_to_self
    title: Mumbling Math Calculation Quietly
    class: reading_thinking_habits
    label: must_not_flag
    rationale: Quiet self-talk or vocalizing steps under breath for 4.0s is under the 5.0s speech grace window.
    expected_max_tier: CLEAR
    expected_hold: false
    expected_resolution: null
    timeline:
      - { t: 50.0, signal: speech_detected, duration: 4.0, confidence: 0.75 }

  - id: stretching_neck_upward
    title: Stretching Neck and Shoulders
    class: reading_thinking_habits
    label: must_not_flag
    rationale: Postural stretch after prolonged desk sitting. Head tilted back for 3.5s (under 4s grace).
    expected_max_tier: CLEAR
    expected_hold: false
    expected_resolution: null
    timeline:
      - { t: 60.0, signal: head_turn, duration: 3.5, confidence: 0.85 }

  # =========================================================================
  # CLASS 2: MOVEMENT PATTERNS (Must Not Flag)
  # =========================================================================

  - id: neurodivergent_adhd_fidgeting
    title: Neurodivergent ADHD Fidgeting
    class: movement_patterns
    label: must_not_flag
    rationale: Frequent brief postural adjustments and rapid head shifts. All individual bursts remain within grace windows.
    expected_max_tier: CLEAR
    expected_hold: false
    expected_resolution: null
    timeline:
      - { t: 35.0, signal: head_turn, duration: 2.5, confidence: 0.80 }
      - { t: 55.0, signal: gaze_off_screen, duration: 2.0, confidence: 0.75 }
      - { t: 80.0, signal: head_turn, duration: 2.8, confidence: 0.80 }
      - { t: 110.0, signal: gaze_off_screen, duration: 2.2, confidence: 0.75 }
      - { t: 140.0, signal: head_turn, duration: 2.5, confidence: 0.80 }

  - id: dropping_pen_retrieving
    title: Dropping Pen and Retrieving from Floor
    class: movement_patterns
    label: must_not_flag
    rationale: Student ducks under desk for 4.0s to retrieve a dropped pen. Face absent grace is 5.0s, so risk is 0.
    expected_max_tier: CLEAR
    expected_hold: false
    expected_resolution: null
    timeline:
      - { t: 50.0, signal: face_absent, duration: 4.0, confidence: 0.90 }

  - id: scratching_face_occlusion
    title: Scratching Face Partial Occlusion
    class: movement_patterns
    label: must_not_flag
    rationale: Hand rests on chin or rubs eye for 3.0s, causing temporary low landmark confidence.
    expected_max_tier: CLEAR
    expected_hold: false
    expected_resolution: null
    timeline:
      - { t: 45.0, signal: face_absent, duration: 3.0, confidence: 0.50 }

  - id: sipping_water_bottle
    title: Sipping Water Bottle
    class: movement_patterns
    label: must_not_flag
    rationale: Lifting water bottle to drink blocks mouth and lower face for 3.5s (under 5s grace).
    expected_max_tier: CLEAR
    expected_hold: false
    expected_resolution: null
    timeline:
      - { t: 60.0, signal: face_absent, duration: 3.5, confidence: 0.80 }

  - id: adjusting_glasses_frequently
    title: Adjusting Eyeglasses
    class: movement_patterns
    label: must_not_flag
    rationale: Student pushes glasses back up bridge of nose for 1.5s bursts.
    expected_max_tier: CLEAR
    expected_hold: false
    expected_resolution: null
    timeline:
      - { t: 40.0, signal: gaze_off_screen, duration: 1.5, confidence: 0.50 }
      - { t: 90.0, signal: gaze_off_screen, duration: 1.8, confidence: 0.50 }

  # =========================================================================
  # CLASS 3: LIGHTING CONDITIONS (Must Not Flag)
  # =========================================================================

  - id: poor_room_lighting_underexposed
    title: Poor Room Lighting (Evening Exam)
    class: lighting_conditions
    label: must_not_flag
    rationale: Dim room lamp causes detector confidence to drop to 0.45 (<0.60 threshold). Investigator opens case and resolves ordinary.
    expected_max_tier: CLEAR
    expected_hold: false
    expected_resolution: ordinary
    probe_responses:
      secondary_detector_cross_check: single_face_confirmed
      soft_reminder: behavior_corrected
    timeline:
      - { t: 40.0, signal: gaze_off_screen, duration: 6.0, confidence: 0.45 }

  - id: transient_backlight_glare
    title: Transient Window Backlight Glare
    class: lighting_conditions
    label: must_not_flag
    rationale: Cloud passes sun, causing transient bright glare behind student for 3.0s. Under grace window.
    expected_max_tier: CLEAR
    expected_hold: false
    expected_resolution: null
    timeline:
      - { t: 50.0, signal: face_absent, duration: 3.0, confidence: 0.45 }

  - id: eyeglass_reflection_jitter
    title: Monitor Reflection on Eyeglasses
    class: lighting_conditions
    label: must_not_flag
    rationale: Screen glow reflects in lenses causing intermittent 2.5s gaze tracking jitter. Under grace.
    expected_max_tier: CLEAR
    expected_hold: false
    expected_resolution: null
    timeline:
      - { t: 45.0, signal: gaze_off_screen, duration: 2.5, confidence: 0.55 }
      - { t: 100.0, signal: gaze_off_screen, duration: 2.8, confidence: 0.55 }

  # =========================================================================
  # CLASS 4: EQUIPMENT & HARDWARE (Must Not Flag)
  # =========================================================================

  - id: short_network_drop_10s
    title: Short Wi-Fi Drop (10s)
    class: equipment_faults
    label: must_not_flag
    rationale: Temporary packet loss for 10s. Investigator tests telemetry, resolves TECHNICAL with 0 weight.
    expected_max_tier: CLEAR
    expected_hold: false
    expected_resolution: technical
    probe_responses:
      network_heartbeat_check: heartbeat_lost
      device_telemetry_check: hardware_fault
    timeline:
      - { t: 40.0, signal: network_drop, duration: 10.0, confidence: 0.55 }

  - id: long_network_outage_45s
    title: Extended Campus Network Outage (45s)
    class: equipment_faults
    label: must_not_flag
    rationale: Router reboot causes prolonged drop. Investigator confirms hardware/ISP fault; zero penalty and channel discounted.
    expected_max_tier: CLEAR
    expected_hold: false
    expected_resolution: technical
    probe_responses:
      network_heartbeat_check: heartbeat_lost
      device_telemetry_check: hardware_fault
    timeline:
      - { t: 40.0, signal: network_drop, duration: 45.0, confidence: 0.55 }

  - id: failing_webcam_repeats_15x
