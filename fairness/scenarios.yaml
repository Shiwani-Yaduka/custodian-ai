    class: equipment_faults
    label: must_not_flag
    rationale: Faulty USB port disconnects camera 15 times. Single camera channel accumulator caps at 40.0, never crossing 45.0 WARNED.
    expected_max_tier: WATCHING
    expected_hold: false
    expected_resolution: null
    timeline:
      - { t: 40.0, signal: face_absent, duration: 8.0, confidence: 0.85 }
      - { t: 60.0, signal: face_absent, duration: 8.0, confidence: 0.85 }
      - { t: 80.0, signal: face_absent, duration: 8.0, confidence: 0.85 }
      - { t: 100.0, signal: face_absent, duration: 8.0, confidence: 0.85 }
      - { t: 120.0, signal: face_absent, duration: 8.0, confidence: 0.85 }
      - { t: 140.0, signal: face_absent, duration: 8.0, confidence: 0.85 }
      - { t: 160.0, signal: face_absent, duration: 8.0, confidence: 0.85 }
      - { t: 180.0, signal: face_absent, duration: 8.0, confidence: 0.85 }
      - { t: 200.0, signal: face_absent, duration: 8.0, confidence: 0.85 }
      - { t: 220.0, signal: face_absent, duration: 8.0, confidence: 0.85 }
      - { t: 240.0, signal: face_absent, duration: 8.0, confidence: 0.85 }
      - { t: 260.0, signal: face_absent, duration: 8.0, confidence: 0.85 }
      - { t: 280.0, signal: face_absent, duration: 8.0, confidence: 0.85 }
      - { t: 300.0, signal: face_absent, duration: 8.0, confidence: 0.85 }
      - { t: 320.0, signal: face_absent, duration: 8.0, confidence: 0.85 }

  - id: low_frame_rate_weak_gpu
    title: Low Frame Rate on Older Hardware
    class: equipment_faults
    label: must_not_flag
    rationale: Laptop CPU throttling drops webcam fps below 2.5. Low confidence opens case; resolves technical.
    expected_max_tier: CLEAR
    expected_hold: false
    expected_resolution: technical
    probe_responses:
      device_telemetry_check: hardware_fault
    timeline:
      - { t: 45.0, signal: low_frame_rate, duration: 12.0, confidence: 0.55 }

  - id: camera_driver_glitch_transient
    title: Transient Camera Driver Glitch
    class: equipment_faults
    label: must_not_flag
    rationale: Operating system camera service restarts, briefly cutting track for 4.0s. Resolves technical.
    expected_max_tier: CLEAR
    expected_hold: false
    expected_resolution: technical
    probe_responses:
      device_telemetry_check: hardware_fault
    timeline:
      - { t: 50.0, signal: camera_track_ended, duration: 4.0, confidence: 0.55 }

  - id: intermittent_wifi_jitter
    title: Intermittent Wi-Fi Jitter
    class: equipment_faults
    label: must_not_flag
    rationale: Occasional 3.0s heartbeat delay every minute. All blips remain below 10.0s grace window.
    expected_max_tier: CLEAR
    expected_hold: false
    expected_resolution: null
    timeline:
      - { t: 40.0, signal: network_drop, duration: 3.0, confidence: 0.55 }
      - { t: 100.0, signal: network_drop, duration: 3.0, confidence: 0.55 }
      - { t: 160.0, signal: network_drop, duration: 3.0, confidence: 0.55 }

  # =========================================================================
  # CLASS 5: ENVIRONMENTAL & OS NOISE (Must Not Flag)
  # =========================================================================

  - id: sibling_walks_past_doorway
    title: Sibling Walks Past Doorway
    class: environmental_noise
    label: must_not_flag
    rationale: Family member appears in background for 2.5s. Secondary cross-check confirms single face returns; resolves ordinary.
    expected_max_tier: CLEAR
    expected_hold: false
    expected_resolution: ordinary
    probe_responses:
      secondary_detector_cross_check: single_face_confirmed
      soft_reminder: behavior_corrected
