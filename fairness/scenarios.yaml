  - id: system_notification_chime_and_blur
    title: OS Notification Ding and Window Blur
    class: environmental_noise
    label: must_not_flag
    rationale: Notification popup unfocuses exam window for 2.0s while playing audio ding for 3.0s. Both are below grace windows (3s window, 5s speech).
    expected_max_tier: CLEAR
    expected_hold: false
    expected_resolution: null
    timeline:
      - { t: 50.0, signal: window_blur, duration: 2.0, confidence: 1.0 }
      - { t: 50.5, signal: speech_detected, duration: 3.0, confidence: 0.70 }

  - id: scratchpad_calculation_and_mumble
    title: Scratchpad Calculation with Quiet Mumbling
    class: reading_thinking_habits
    label: must_not_flag
    rationale: Student looks down at approved scratchpad for 3.0s while vocalizing numbers for 3.5s. Below 4.0s gaze grace and 5.0s speech grace.
    expected_max_tier: CLEAR
    expected_hold: false
    expected_resolution: null
    timeline:
      - { t: 45.0, signal: gaze_off_screen, duration: 3.0, confidence: 0.80 }
      - { t: 45.5, signal: speech_detected, duration: 3.5, confidence: 0.75 }

  # =========================================================================
  # CLASS 6: DELIBERATE VIOLATIONS (Must Catch — HELD Expected)
  # =========================================================================

  - id: notes_plus_speech_corroborated
    title: Looking at Notes with Whisper Corroboration
    class: deliberate_violations
    label: must_catch
    rationale: Candidate repeatedly stares down at hidden notes for 25s while whispering answers into phone. 2 channels, deliberate finding, must reach HELD.
    expected_max_tier: HELD
    expected_hold: true
    expected_resolution: deliberate
    probe_responses:
      high_res_frame_burst: clear_secondary_actor
      secondary_detector_cross_check: anomaly_confirmed
      soft_reminder: behavior_continued
      short_explanation_prompt: prompt_ignored
    timeline:
      - { t: 40.0, signal: head_turn, duration: 25.0, confidence: 0.90 }
      - { t: 42.0, signal: speech_detected, duration: 25.0, confidence: 0.90 }
      - { t: 70.0, signal: head_turn, duration: 25.0, confidence: 0.90 }
      - { t: 72.0, signal: speech_detected, duration: 25.0, confidence: 0.90 }
      - { t: 100.0, signal: head_turn, duration: 25.0, confidence: 0.90 }
      - { t: 102.0, signal: speech_detected, duration: 25.0, confidence: 0.90 }
      - { t: 130.0, signal: head_turn, duration: 25.0, confidence: 0.90 }
      - { t: 132.0, signal: speech_detected, duration: 25.0, confidence: 0.90 }

