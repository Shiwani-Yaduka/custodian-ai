[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "custodian-ai"
version = "0.1.0"
description = "Adaptive AI Exam Proctor"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Shiwani" }
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["core/tests", "services", "fairness"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4"]
ignore = ["B008"]
