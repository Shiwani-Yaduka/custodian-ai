# Dependabot opens pull requests when libraries, Docker base images or GitHub Actions have updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      - dependency-name: python
  - package-ecosystem: docker
    directory: /web
    schedule: { interval: weekly }
